name: Daily Sermon Generator

on:
  schedule:
    - cron: '0 2 * * *' # Runs automatically every day at 2:00 AM UTC
  workflow_dispatch: # Enables a manual "Run workflow" button in GitHub

jobs:
  generate-sermon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Auto-Progression Sermon Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PRIMARY_MODEL: "google/gemini-2.0-flash-exp:free"
          FALLBACK_MODEL: "meta-llama/llama-3.3-70b-instruct:free"
        run: python3 main.py --auto 2