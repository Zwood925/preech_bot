<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><meta name="theme-color" content="#111"><link rel="manifest" href="/manifest.json">
<title>Sermon — PreechBot</title>
<style>
body{font-family:'Courier New',monospace;background:#0a0014;color:#f0e6c8;margin:0;padding:0;line-height:1.6;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:20px}
h1{color:#ff00aa;font-size:24px;border-bottom:2px solid #ff00aa;padding-bottom:8px;text-shadow:0 0 8px rgba(255,0,170,0.4)}
.meta{color:#aaa;font-size:12px;margin:8px 0}
.audio{margin:16px 0;background:rgba(255,0,170,0.08);padding:12px;border:1px solid #ff00aa}
audio{width:100%}
.text{white-space:pre-wrap;background:rgba(0,0,0,0.4);padding:16px;border-left:4px solid #ff00aa;color:#f0e6c8;font-size:15px}
.back{display:inline-block;margin:16px 0;padding:8px 14px;background:#ff00aa;color:#fff;text-decoration:none;border-radius:3px;font-weight:bold}
.tag{display:inline-block;background:rgba(255,0,170,0.2);color:#ff00aa;padding:2px 8px;margin:2px;border:1px solid #ff00aa;font-size:10px;text-transform:uppercase}
@media (max-width:600px){
  .wrap{padding:12px}
  h1{font-size:20px}
  .text{font-size:14px;padding:12px}
}
</style>
</head>
<body>
<div class="wrap">
<a href="/" class="back">&larr; Back to Sermons</a>
<div id="s">Loading…</div>
</div>
<script>
async function load() {
  const id = window.location.pathname.split('/').filter(Boolean).pop();
  try {
    const r = await fetch('/api/sermon/' + id);
    const d = await r.json();
    if (d.error) { document.getElementById('s').innerHTML = '<p style="color:#ff5577">Sermon not found.</p>'; return; }
    const tags = (d.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');
    document.getElementById('s').innerHTML = `
      <h1>${d.title}</h1>
      <div class="meta">Passage: <strong>${d.passage}</strong> &middot; Status: ${d.status}</div>
      <div>${tags}</div>
      ${d.audio ? '<div class="audio"><audio controls src="'+d.audio+'"></audio></div>' : '<div class="meta">No audio yet</div>'}
      <div class="text">${d.preview || '<em>No text available.</em>'}</div>
    `;
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
  } catch (e) {
    document.getElementById('s').innerHTML = '<p style="color:#ff5577">Failed to load — backend may be offline.</p>';
  }
}
load();
</script>
</body>
</html>
